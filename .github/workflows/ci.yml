name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  mechanical-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out vitrum
        uses: actions/checkout@v4
        with:
          path: vitrum

      - name: Check out path tracer fork
        uses: actions/checkout@v4
        with:
          repository: jsquire4/three-gpu-pathtracer
          ref: phase4-normalmap-shadow-rays
          path: three-gpu-pathtracer

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vitrum/package-lock.json

      - name: Install dependencies
        working-directory: vitrum
        run: npm ci

      - name: Typecheck
        working-directory: vitrum
        run: npm run typecheck

      - name: Test
        working-directory: vitrum
        run: npm test

      - name: Fork shader smoke
        working-directory: vitrum
        run: npm run fork-shader-smoke

      - name: Release dry run
        working-directory: vitrum
        run: npm run release:dry-run
