name: CI

# Triggers: every push to main and every PR targeting any branch.
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  mechanical-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out vitrum
        # Plain checkout — no path: subdirectory, no fork submodule.
        # The deleted jsquire4/three-gpu-pathtracer checkout has been removed;
        # the THREE fork was fully excised from the runtime graph (2026-06-09).
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Dev rig runs Node 24 (.nvm/versions/node/v24.13.0); using 24 here
          # to match exactly. Note: .nvmrc says "20" and package.json engines
          # says ">=20" — both are satisfied by 24. If .nvmrc is ever updated
          # to pin 24, this comment can be removed.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Lint currently has 324 errors / 81 warnings across the workspace
      # (verified 2026-06-10 local run, eslint v9 flat-config exits 0 even
      # when violations are present). `continue-on-error: true` keeps CI
      # green while the backlog is worked down. Remove continue-on-error (or
      # add --max-warnings 0) once the violation count reaches zero.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      # GPU-dependent steps (validate:gpu, shader-compile-ci, test:gpu,
      # benchmark:gap-closure, benchmark:rc-acceptance-mechanical) are
      # intentionally omitted — GitHub-hosted ubuntu-latest runners have no
      # GPU. These run in the wsl-gpu environment via the pre-push hook and
      # the T1 GPU smoke scripts in ~/projects/wsl-gpu.
