name: CI

# Triggers: every push to main and every PR targeting any branch.
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  mechanical-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out vitrum
        # Plain checkout — no path: subdirectory, no fork submodule.
        # The deleted jsquire4/three-gpu-pathtracer checkout has been removed;
        # the THREE fork was fully excised from the runtime graph (2026-06-09).
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Dev rig runs Node 24 (.nvm/versions/node/v24.13.0); using 24 here
          # to match exactly. Note: .nvmrc says "20" and package.json engines
          # says ">=20" — both are satisfied by 24. If .nvmrc is ever updated
          # to pin 24, this comment can be removed.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Lint currently has 324 errors / 81 warnings across the workspace
      # (verified 2026-06-10 local run, eslint v9 flat-config exits 0 even
      # when violations are present). `continue-on-error: true` keeps CI
      # green while the backlog is worked down. Remove continue-on-error (or
      # add --max-warnings 0) once the violation count reaches zero.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      # GPU-dependent steps (validate:gpu, shader-compile-ci, test:gpu,
      # benchmark:gap-closure, benchmark:rc-acceptance-mechanical) are
      # intentionally omitted — GitHub-hosted ubuntu-latest runners have no
      # GPU. These run in the wsl-gpu environment via the pre-push hook and
      # the T1 GPU smoke scripts in ~/projects/wsl-gpu.

  shader-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out vitrum
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          # Use a recent stable Deno — must match or exceed the dev rig's 2.8.1.
          # The --unstable-webgpu flag requires Deno >=1.39; 2.x is fine.
          deno-version: "~2.8"

      - name: Install Mesa lavapipe (software Vulkan)
        # lavapipe provides a CPU-side Vulkan ICD (lvp_icd.x86_64.json) that
        # exposes WebGPU without real GPU hardware.  The package name and ICD
        # path differ slightly between Ubuntu LTS versions:
        #   Ubuntu 22.04 (jammy): mesa-vulkan-drivers, ICD = lvp_icd.x86_64.json
        #   Ubuntu 24.04 (noble): same package, same ICD path
        # Both candidate paths are passed to VK_ICD_FILENAMES so the script works
        # regardless of the runner's exact Ubuntu version.  The x86_64-specific
        # path is also tried as a fallback (some Mesa builds omit the arch suffix).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers

      - name: Run WGSL shader compile gate
        env:
          # Try the arch-suffixed name first (Ubuntu 22.04+), then the bare name.
          # If neither exists the gate will report "no adapter" and exit 1.
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json:/usr/share/vulkan/icd.d/lvp_icd.json
        run: npm run shader-gate
