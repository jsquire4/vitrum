name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  mechanical-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out vitrum
        uses: actions/checkout@v4
        with:
          path: vitrum

      - name: Check out path tracer fork
        uses: actions/checkout@v4
        with:
          repository: jsquire4/three-gpu-pathtracer
          ref: phase4-normalmap-shadow-rays
          path: three-gpu-pathtracer

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vitrum/package-lock.json

      - name: Install dependencies
        working-directory: vitrum
        run: npm ci

      - name: Typecheck
        working-directory: vitrum
        run: npm run typecheck

      - name: Typecheck staging shims
        working-directory: vitrum
        run: npm run typecheck:staging

      - name: Test
        working-directory: vitrum
        run: npm test

      - name: Fork shader smoke
        working-directory: vitrum
        run: npm run fork-shader-smoke

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('vitrum/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        working-directory: vitrum
        run: npx playwright install --with-deps chromium

      - name: Shader-compile CI guard
        working-directory: vitrum
        run: npm run shader-compile-ci

      - name: Benchmark gap-closure strict (capture-enabled runners)
        if: ${{ env.VITRUM_GPU_CAPTURE == '1' }}
        working-directory: vitrum
        run: VITRUM_STRICT_GAP_CLOSURE=1 npm run benchmark:gap-closure

      - name: Benchmark gap-closure skipped (no capture runner)
        if: ${{ env.VITRUM_GPU_CAPTURE != '1' }}
        working-directory: vitrum
        run: echo "Skipping benchmark gap-closure: this runner is not capture-capable (VITRUM_GPU_CAPTURE!=1)."

      - name: Release dry run
        working-directory: vitrum
        run: npm run release:dry-run
