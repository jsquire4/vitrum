<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vitrum — Cornell box (pt-webgl)</title>
    <style>
      body {
        margin: 0;
        background: #111;
        color: #ccc;
        font-family: system-ui, sans-serif;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      /* Overlay for bilateral / OIDN / WebGPU denoise — PT accumulation stays on #c underneath. */
      #denoise {
        display: none;
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        z-index: 2;
        pointer-events: none;
      }
      #status {
        position: fixed;
        left: 12px;
        bottom: 12px;
        font-size: 12px;
        opacity: 0.85;
      }
      #start {
        position: fixed;
        inset: 50% auto auto 50%;
        transform: translate(-50%, -50%);
        padding: 14px 20px;
        border: 1px solid #666;
        border-radius: 8px;
        background: #202020;
        color: #eee;
        font: inherit;
        cursor: pointer;
      }
      #start[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <canvas id="denoise" aria-hidden="true"></canvas>
    <button id="start" type="button">Start WebGL render</button>
    <div id="status">Initializing…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
