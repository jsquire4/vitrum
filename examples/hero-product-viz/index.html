<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vitrum — Product Visualizer</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #0e0e0e;
        color: #ccc;
        font-family: system-ui, sans-serif;
        overflow: hidden;
        display: flex;
      }
      canvas {
        flex: 1;
        display: block;
        height: 100vh;
      }
      #panel {
        width: 270px;
        min-width: 240px;
        background: #161616;
        border-left: 1px solid #2a2a2a;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        font-size: 13px;
        overflow-y: auto;
      }
      #panel h2 { margin: 0 0 2px; font-size: 15px; color: #eee; }
      #panel p  { margin: 0; font-size: 11px; color: #666; }
      .section { display: flex; flex-direction: column; gap: 8px; }
      .section h3 { margin: 0 0 2px; font-size: 12px; color: #999; text-transform: uppercase; letter-spacing: 0.05em; }
      .row { display: flex; align-items: center; gap: 8px; }
      .row label { width: 90px; color: #888; flex-shrink: 0; font-size: 12px; }
      .row input[type="range"] { flex: 1; accent-color: #7af; }
      .row .val { width: 40px; text-align: right; color: #bbb; font-size: 11px; font-variant-numeric: tabular-nums; }
      #spp-bar-wrap {
        background: #222;
        border-radius: 4px;
        height: 6px;
        overflow: hidden;
      }
      #spp-bar {
        height: 100%;
        background: linear-gradient(90deg, #2a6fcc, #7af);
        width: 0%;
        transition: width 0.15s;
      }
      #spp-label {
        font-size: 12px;
        color: #888;
        font-variant-numeric: tabular-nums;
      }
      #btn-save {
        background: #1a5fa8;
        border: 1px solid #4af;
        color: #ddf;
        padding: 9px 14px;
        border-radius: 7px;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
        width: 100%;
        transition: background 0.15s;
      }
      #btn-save:hover { background: #246dc0; }
      #btn-save:disabled { opacity: 0.4; cursor: default; }
      #status {
        position: fixed;
        bottom: 12px;
        left: 12px;
        font-size: 11px;
        opacity: 0.55;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>

    <div id="panel">
      <div>
        <h2>Product Visualizer</h2>
        <p>Progressive path tracer — adjust material, then save a high-res render.</p>
      </div>

      <div class="section">
        <h3>Progress</h3>
        <div id="spp-label">SPP: 0 / 512</div>
        <div id="spp-bar-wrap"><div id="spp-bar"></div></div>
      </div>

      <div class="section">
        <h3>Glass Material</h3>
        <div class="row">
          <label>Roughness</label>
          <input type="range" id="roughness" min="0" max="1" step="0.01" value="0.05">
          <span class="val" id="v-roughness">0.05</span>
        </div>
        <div class="row">
          <label>Metallic</label>
          <input type="range" id="metallic" min="0" max="1" step="0.01" value="0.00">
          <span class="val" id="v-metallic">0.00</span>
        </div>
        <div class="row">
          <label>Transmission</label>
          <input type="range" id="transmission" min="0" max="1" step="0.01" value="0.95">
          <span class="val" id="v-transmission">0.95</span>
        </div>
        <div class="row">
          <label>IOR</label>
          <input type="range" id="ior" min="1.0" max="2.5" step="0.01" value="1.50">
          <span class="val" id="v-ior">1.50</span>
        </div>
      </div>

      <div class="section">
        <h3>Save Render</h3>
        <p style="margin-bottom:6px">
          Renders at up to 4K, waits for convergence (~30s), then downloads
          a PNG. Be patient.
        </p>
        <button id="btn-save">Save high-res PNG</button>
      </div>
    </div>

    <div id="status">Initializing path tracer…</div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
