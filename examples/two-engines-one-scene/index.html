<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vitrum — two engines, one Scene (G2)</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #0a0a0b;
        color: #c8c8cc;
        font-family: system-ui, sans-serif;
      }
      .wrap {
        display: grid;
        grid-template-rows: auto 1fr 1fr 1fr;
        min-height: 100vh;
      }
      h1 {
        margin: 0;
        padding: 10px 14px;
        font-size: 14px;
        font-weight: 600;
        border-bottom: 1px solid #222;
      }
      .panel {
        position: relative;
        border-top: 1px solid #222;
        min-height: 160px;
      }
      .panel h2 {
        position: absolute;
        left: 10px;
        top: 8px;
        margin: 0;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        opacity: 0.65;
        z-index: 1;
        pointer-events: none;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #status {
        position: fixed;
        right: 12px;
        bottom: 10px;
        font-size: 11px;
        opacity: 0.85;
        max-width: 48vw;
        text-align: right;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Same <code>Scene</code> — pt-webgl (top) · walkaround-hybrid (middle) · pt-webgpu (bottom) <span style="font-size:11px;opacity:0.6;margin-left:12px;"><a href="/pt-webgl.html" style="color:#aac;margin-right:8px;">pt-webgl alone</a><a href="/walkaround.html" style="color:#aac;margin-right:8px;">walkaround alone</a><a href="/pt-webgpu.html" style="color:#aac;">pt-webgpu alone</a></span></h1>
      <div class="panel">
        <h2>pt-webgl</h2>
        <canvas id="c-pt"></canvas>
      </div>
      <div class="panel">
        <h2>walkaround-hybrid</h2>
        <canvas id="c-wgpu"></canvas>
      </div>
      <div class="panel">
        <h2>pt-webgpu</h2>
        <canvas id="c-ptgpu"></canvas>
      </div>
    </div>
    <div id="status">Initializing…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
