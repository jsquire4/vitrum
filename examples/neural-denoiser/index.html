<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vitrum — neural denoiser demo (W10)</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #0a0a0b; color: #c8c8cc; font-family: system-ui, sans-serif; }
      .wrap { display: grid; grid-template-rows: auto auto 1fr; min-height: 100vh; }
      h1 {
        margin: 0; padding: 10px 14px; font-size: 14px; font-weight: 600;
        border-bottom: 1px solid #222;
      }
      .controls {
        padding: 8px 14px; border-bottom: 1px solid #222; display: flex;
        gap: 12px; flex-wrap: wrap; font-size: 12px; align-items: center;
      }
      .controls label { opacity: 0.8; }
      .controls a { color: #aac; }
      .panel { position: relative; border-top: 1px solid #222; min-height: 320px; }
      .panel h2 {
        position: absolute; left: 10px; top: 8px; margin: 0;
        font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
        opacity: 0.65; z-index: 1; pointer-events: none;
      }
      canvas { display: block; width: 100%; height: 100%; }
      #status {
        position: fixed; right: 12px; bottom: 10px; font-size: 11px;
        opacity: 0.85; max-width: 48vw; text-align: right; line-height: 1.35;
      }
      .pill {
        background: #1a1a1d; padding: 2px 8px; border-radius: 10px;
        font-size: 11px; opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>vitrum — neural denoiser demo (W10)</h1>
      <div class="controls">
        <span>Denoiser:</span>
        <a href="?denoiser=atrous-variance" class="pill" data-mode="atrous-variance">atrous-variance (default)</a>
        <a href="?denoiser=svgf-real"       class="pill" data-mode="svgf-real">svgf-real</a>
        <a href="?denoiser=neural"          class="pill" data-mode="neural">neural (U-Net)</a>
        <span style="opacity:0.5;margin-left:auto;">
          <code>?denoiser=neural</code> loads a deterministic-random-weights model — for pipeline wiring smoke-test only;
          ship <code>vi-neural-weights.json</code> for real denoising (see package README).
        </span>
      </div>
      <div class="panel">
        <h2 id="panel-title">walkaround-hybrid</h2>
        <canvas id="c"></canvas>
      </div>
    </div>
    <div id="status">Initializing…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
