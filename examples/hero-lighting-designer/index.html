<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vitrum — Lighting Designer</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #111;
        color: #ccc;
        font-family: system-ui, sans-serif;
        overflow: hidden;
        display: flex;
      }
      canvas {
        flex: 1;
        display: block;
        height: 100vh;
      }
      #panel {
        width: 280px;
        min-width: 240px;
        background: #1a1a1a;
        border-left: 1px solid #333;
        overflow-y: auto;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        font-size: 13px;
      }
      #panel h2 { margin: 0 0 4px; font-size: 14px; color: #eee; }
      .light-card {
        background: #242424;
        border-radius: 8px;
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .light-card h3 {
        margin: 0 0 4px;
        font-size: 13px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .light-swatch {
        display: inline-block;
        width: 14px; height: 14px;
        border-radius: 50%;
        border: 1px solid #555;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .row label { width: 60px; color: #999; flex-shrink: 0; }
      .row input[type="range"] { flex: 1; accent-color: #4af; }
      .row .val { width: 36px; text-align: right; color: #bbb; font-size: 12px; }
      #hud {
        position: fixed;
        top: 12px;
        left: 12px;
        font-size: 13px;
        background: rgba(0,0,0,0.55);
        padding: 6px 10px;
        border-radius: 6px;
        pointer-events: none;
        font-variant-numeric: tabular-nums;
      }
      #status {
        position: fixed;
        bottom: 12px;
        left: 12px;
        font-size: 11px;
        opacity: 0.6;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>

    <div id="panel">
      <div>
        <h2>Lighting Designer</h2>
        <p style="margin:0; font-size:11px; color:#666">
          Adjust lights — real-time GI updates via walkaround-hybrid.
        </p>
      </div>

      <!-- Light 0 -->
      <div class="light-card">
        <h3>
          <span class="light-swatch" id="swatch-0" style="background:#ff6644"></span>
          Light A (warm)
        </h3>
        <div class="row"><label>R</label><input type="range" id="l0-r" min="0" max="255" value="255"><span class="val" id="v-l0-r">255</span></div>
        <div class="row"><label>G</label><input type="range" id="l0-g" min="0" max="255" value="100"><span class="val" id="v-l0-g">100</span></div>
        <div class="row"><label>B</label><input type="range" id="l0-b" min="0" max="255" value="68"><span class="val" id="v-l0-b">68</span></div>
        <div class="row"><label>Intensity</label><input type="range" id="l0-i" min="0" max="20" step="0.1" value="8"><span class="val" id="v-l0-i">8.0</span></div>
        <div class="row"><label>X</label><input type="range" id="l0-x" min="-4" max="4" step="0.1" value="-2"><span class="val" id="v-l0-x">-2.0</span></div>
        <div class="row"><label>Y</label><input type="range" id="l0-y" min="0" max="5" step="0.1" value="2.5"><span class="val" id="v-l0-y">2.5</span></div>
        <div class="row"><label>Z</label><input type="range" id="l0-z" min="-4" max="4" step="0.1" value="1"><span class="val" id="v-l0-z">1.0</span></div>
      </div>

      <!-- Light 1 -->
      <div class="light-card">
        <h3>
          <span class="light-swatch" id="swatch-1" style="background:#4488ff"></span>
          Light B (cool)
        </h3>
        <div class="row"><label>R</label><input type="range" id="l1-r" min="0" max="255" value="68"><span class="val" id="v-l1-r">68</span></div>
        <div class="row"><label>G</label><input type="range" id="l1-g" min="0" max="255" value="136"><span class="val" id="v-l1-g">136</span></div>
        <div class="row"><label>B</label><input type="range" id="l1-b" min="0" max="255" value="255"><span class="val" id="v-l1-b">255</span></div>
        <div class="row"><label>Intensity</label><input type="range" id="l1-i" min="0" max="20" step="0.1" value="6"><span class="val" id="v-l1-i">6.0</span></div>
        <div class="row"><label>X</label><input type="range" id="l1-x" min="-4" max="4" step="0.1" value="2"><span class="val" id="v-l1-x">2.0</span></div>
        <div class="row"><label>Y</label><input type="range" id="l1-y" min="0" max="5" step="0.1" value="2.5"><span class="val" id="v-l1-y">2.5</span></div>
        <div class="row"><label>Z</label><input type="range" id="l1-z" min="-4" max="4" step="0.1" value="-1"><span class="val" id="v-l1-z">-1.0</span></div>
      </div>

      <!-- Light 2 -->
      <div class="light-card">
        <h3>
          <span class="light-swatch" id="swatch-2" style="background:#ffffaa"></span>
          Light C (fill)
        </h3>
        <div class="row"><label>R</label><input type="range" id="l2-r" min="0" max="255" value="255"><span class="val" id="v-l2-r">255</span></div>
        <div class="row"><label>G</label><input type="range" id="l2-g" min="0" max="255" value="255"><span class="val" id="v-l2-g">255</span></div>
        <div class="row"><label>B</label><input type="range" id="l2-b" min="0" max="255" value="170"><span class="val" id="v-l2-b">170</span></div>
        <div class="row"><label>Intensity</label><input type="range" id="l2-i" min="0" max="20" step="0.1" value="3"><span class="val" id="v-l2-i">3.0</span></div>
        <div class="row"><label>X</label><input type="range" id="l2-x" min="-4" max="4" step="0.1" value="0"><span class="val" id="v-l2-x">0.0</span></div>
        <div class="row"><label>Y</label><input type="range" id="l2-y" min="0" max="5" step="0.1" value="3.5"><span class="val" id="v-l2-y">3.5</span></div>
        <div class="row"><label>Z</label><input type="range" id="l2-z" min="-4" max="4" step="0.1" value="3"><span class="val" id="v-l2-z">3.0</span></div>
      </div>
    </div>

    <div id="hud">FPS: —</div>
    <div id="status">Initializing…</div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
